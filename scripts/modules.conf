#!/usr/bin/env bash
# ============================================================================
# modules.conf — 模块定义 (所有脚本共享)
#
# 每行格式:  SLUG|KERNEL_PATHS|QEMU_EXTRA|FS_IMAGE|ENABLE_SYSCALLS_FILE
#   SLUG           : 简短标识, 如 xfs, btrfs
#   KERNEL_PATHS   : 空格分隔的内核插桩路径
#   QEMU_EXTRA     : 额外 QEMU 参数 (如果不需要留空 -)
#   FS_IMAGE       : 挂载用的文件系统镜像文件名 (放在 images/ 下)
#   SYSCALLS_FILE  : exp/<slug>/syscalls.txt (相对 EXP_DIR, - 则使用默认)
# ============================================================================

# 文件系统模块 ---------------------------------------------------------------
xfs|fs/xfs/|-hdb ${KERNEL_IMAGES_DIR}/xfs-2G.qcow2|xfs-2G.qcow2|xfs
btrfs|fs/btrfs/|-hdb ${KERNEL_IMAGES_DIR}/btrfs-2G.qcow2|btrfs-2G.qcow2|btrfs
f2fs|fs/f2fs/|-hdb ${KERNEL_IMAGES_DIR}/f2fs-2G.qcow2|f2fs-2G.qcow2|f2fs
jfs|fs/jfs/|-hdb ${KERNEL_IMAGES_DIR}/jfs-2G.qcow2|jfs-2G.qcow2|jfs
ocfs2|fs/ocfs2/|-hdb ${KERNEL_IMAGES_DIR}/ocfs2-2G.qcow2|ocfs2-2G.qcow2|ocfs2
ext4|fs/ext4/|-hdb ${KERNEL_IMAGES_DIR}/ext4-2G.qcow2|ext4-2G.qcow2|ext4
overlayfs|fs/overlayfs/|-|-|overlayfs

# 驱动模块 -------------------------------------------------------------------
floppy|drivers/block/floppy.c|-|-|floppy
usb-driver|drivers/usb/|-|-|usb-driver
video|drivers/media/v4l2-core/|-|-|video

# 网络/蓝牙模块 ---------------------------------------------------------------
wifi-stack|net/wireless/ net/mac80211/|-|-|wifi
bt-stack|net/bluetooth/|-|-|bt-stack

# TTY/声卡模块 ----------------------------------------------------------------
ptmx|drivers/tty/pty.c drivers/tty/tty_io.c drivers/tty/tty_ioctl.c drivers/tty/tty_ldisc.c drivers/tty/tty_buffer.c drivers/tty/tty_port.c drivers/tty/n_tty.c drivers/tty/tty_mutex.c drivers/tty/tty_ldsem.c|-|-|ptmx
dsp|sound/hda/ sound/core/|-|-|dsp
